main.append(stage);const svg=stage.querySelector('svg'),rope=stage.querySelector('.net-tether'),boat=stage.querySelector('.boat-art'),net=stage.querySelector('.net-art');const control=stage.querySelector('.stage-control');if(scene===1)svg.setAttribute('viewBox','160 30 740 300');let ropeSway=0,ropeVelocity=0,lastRopeX=null;const reducedRope=matchMedia('(prefers-reduced-motion: reduce)').matches;function attachRope(){if(!stage.isConnected)return;const root=svg.getScreenCTM();if(root){const inv=root.inverse();const point=(group,x,y)=>new DOMPoint(x,y).matrixTransform(group.getScreenCTM()).matrixTransform(inv);const anchor=new DOMPoint(cast?662:466,cast?239:186).matrixTransform((cast?net:boat).getScreenCTM());const bounds=stage.getBoundingClientRect();control.style.left=(anchor.x-bounds.left)+'px';control.style.top=(anchor.y-bounds.top)+'px';const a=point(boat,500,202),b=point(net,600,239),sag=Math.min(38,Math.hypot(b.x-a.x,b.y-a.y)*.16);let impulse=lastRopeX===null?0:(b.x-lastRopeX)*.06;lastRopeX=b.x;ropeVelocity=(ropeVelocity-ropeSway*.055+impulse)*.86;ropeSway+=ropeVelocity;let sway=reducedRope?0:Math.sin(performance.now()/420)*5+Math.max(-28,Math.min(28,ropeSway));rope.setAttribute('d',`M${a.x} ${a.y} C${a.x+(b.x-a.x)*.3} ${a.y+sag+sway} ${a.x+(b.x-a.x)*.7} ${b.y+sag-sway} ${b.x} ${b.y}`)}requestAnimationFrame(attachRope)}requestAnimationFrame(attachRope);let start=null,dx=0,dy=0,done=false,netDeployed=false,reelCount=0;function deployOrReel(){if(done)return;if(!netDeployed){netDeployed=true;stage.classList.add('net-deployed');control.textContent='0 / 3';control.setAttribute('aria-label','点击收网，已完成零次，共需三次');return}reelCount++;control.textContent=reelCount+' / 3';control.setAttribute('aria-label','点击收网，已完成'+reelCount+'次，共需三次');stage.style.setProperty('--reel',reelCount);tone(20+reelCount*6);if(reelCount>=3)finish()}function finish(){if(done)return;done=true;stage.classList.add('casting');tone(52);timer=setTimeout(()=>{stage.remove();fn()},matchMedia('(prefers-reduced-motion: reduce)').matches?50:1800)}control.onpointerdown=e=>{dx=0;dy=0;start={x:e.clientX,y:e.clientY};control.setPointerCapture(e.pointerId)};control.onpointermove=e=>{if(!start||netDeployed)return;dx=Math.max(-45,Math.min(65,e.clientX-start.x));dy=Math.max(-25,Math.min(40,e.clientY-start.y));stage.style.setProperty('--drag-x',dx+'px');stage.style.setProperty('--drag-y',dy+'px');stage.classList.add('dragging');stage.style.setProperty('--flow-shift',Math.min(80,Math.hypot(dx,dy))+'px')};control.onpointerup=()=>{if(scene===1&&cast){if(netDeployed||Math.hypot(dx,dy)>35)deployOrReel();else resetDrag()}else if(!cast||Math.hypot(dx,dy)>35)finish();else{stage.style.setProperty('--drag-x','0px');stage.style.setProperty('--drag-y','0px')}stage.classList.remove('dragging');start=null};control.onclick=e=>{if(e.detail===0){if(scene===1&&cast)deployOrReel();else finish()}};function resetDrag(){stage.style.setProperty('--drag-x','0px');stage.style.setProperty('--drag-y','0px');stage.classList.remove('dragging')}control.onpointercancel=()=>{start=null;if(!netDeployed)resetDrag()};
}
function enhance(){if(scene===0)addActor(()=>{phase=1;passage(intro,()=>go(1))},false);if(scene===1){addActor(()=>pick(salvageRound%3),true);const hint=$('#gameStage .game-hint');const feedback=$('#feedback');if(hint&&feedback){feedback.textContent='拖动网环撒网，松手后点击网环三次，拽起潜流。';let task=document.createElement('p');task.className='salvage-task';task.textContent='你今天的工作是捞起三条潜流。';feedback.before(task);feedback.classList.add('salvage-instruction');hint.remove()}let a=main.querySelector('article .actions');if(a){a.classList.add('cabin-link');$('#gameStage').append(a)}};if(scene===2){const field=$('textarea');if(field)field.addEventListener('focus',()=>{drift=40},{once:true})}if(scene===3)addActor(fractureScene,true)}
document.addEventListener('pointerdown',()=>{if(!muted)syncSound()},{once:true});if('speechSynthesis' in window)speechSynthesis.getVoices();$('#prev').onclick=()=>go(scene-1);$('#next').onclick=()=>go(scene+1);window.addEventListener('popstate',()=>go(Number(location.hash.match(/scene=(\d)/)?.[1]||1)-1,true));let startX,startY;main.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});main.addEventListener('touchend',e=>{if(e.target.closest('textarea,button,a'))return;let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*2)go(scene+(dx<0?1:-1))},{passive:true});go(Number(location.hash.match(/scene=(\d)/)?.[1]||1)-1,true);
